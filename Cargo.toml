[package]
name = "howmoji"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
inquire = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.10"
dirs = "6.0.0"

[dev-dependencies]
assert_cmd = "2.0.17"
mockall = "0.13.1"
tempfile = "3.20.0"

[profile.dev]
debug = true

[profile.test]
debug = true

